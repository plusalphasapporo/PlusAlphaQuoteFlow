<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuoteFlow Cloud</title>
  <style>
    :root{
      --navy:#07162f;--navy2:#0e2448;--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;
      --line:#dfe6f1;--blue:#2563eb;--blue2:#1d4ed8;--orange:#ea580c;--green:#059669;--red:#dc2626;
      --soft:#eef4ff;--shadow:0 10px 30px rgba(15,23,42,.06)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
    header{height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
    .brand{font-size:19px;font-weight:900}.sub{font-size:11px;opacity:.72;margin-top:2px}
    .wrap{max-width:1380px;margin:auto;padding:22px}
    .login{max-width:460px;margin:8vh auto}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
    .field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:800;color:#475569}
    .field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
    button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}
    .orange{background:var(--orange);color:#fff}.green{background:var(--green);color:#fff}
    .ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
    .hidden{display:none!important}.muted{color:var(--muted)}
    .notice{padding:12px 14px;border-radius:10px;background:#eff6ff;color:#1e3a8a;margin:12px 0}
    .error{background:#fef2f2;color:#991b1b}.ok{background:#ecfdf5;color:#065f46}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:16px 0}
    .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
    .kpi .label{font-size:12px;color:var(--muted);font-weight:800}.kpi .value{font-size:30px;font-weight:900;margin-top:6px}
    .section{margin-top:18px}.section h2{margin:0 0 6px}.sectionDesc{margin:0 0 14px;color:var(--muted);font-size:13px}
    .item{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
    .item h3{margin:0 0 5px;font-size:14px}.item p{margin:4px 0;font-size:13px;color:#475569}
    .tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
    table{width:100%;border-collapse:collapse;min-width:720px}
    th,td{padding:11px 12px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px;vertical-align:middle}
    th{color:#64748b;background:#fafcff;position:sticky;top:0}
    tr:last-child td{border-bottom:0}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#f8fafc;border:1px solid var(--line);font-size:12px;font-weight:800}
    .pill.good{background:#ecfdf5;color:#047857}.pill.bad{background:#fef2f2;color:#b91c1c}.pill.warn{background:#fff7ed;color:#c2410c}
    .appShell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
    .side{position:sticky;top:90px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
    .sideTitle{padding:8px 10px 10px;font-size:11px;font-weight:900;color:#94a3b8;letter-spacing:.08em}
    .navBtn{width:100%;display:flex;align-items:center;justify-content:flex-start;gap:10px;background:transparent;color:#334155;padding:11px 12px;margin:2px 0;border:1px solid transparent}
    .navBtn:hover{background:#f8fafc}.navBtn.active{background:var(--soft);border-color:#c7d7ff;color:#1d4ed8}
    .workspace{min-width:0}
    .workspaceHead{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px 18px;box-shadow:var(--shadow)}
    .workspaceHead h1{margin:0 0 4px;font-size:24px}.workspaceHead .meta{font-size:13px;color:var(--muted)}
    .pageIntro{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 0 10px}
    .pageIntro h2{margin:0;font-size:20px}.pageIntro p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .empty{padding:30px 16px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:14px}
    .amount{font-variant-numeric:tabular-nums;font-weight:800}
    .hold{color:#b91c1c;font-weight:900}.normal{color:#047857;font-weight:800}
    .quoteItems{display:grid;gap:10px;margin:10px 0}
    .quoteItemRow{display:grid;grid-template-columns:minmax(220px,2fr) 110px 150px 150px 44px;gap:9px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fafcff}
    .quoteItemRow .field{margin:0}.quoteItemRow .removeItem{height:42px;padding:0;background:#fff;border:1px solid #fecaca;color:#b91c1c}
    .quoteTotals{display:flex;justify-content:flex-end;gap:18px;flex-wrap:wrap;padding:12px 0;font-size:13px}.quoteTotals strong{font-size:18px}
    .quoteDetailHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
    .linkBtn{background:transparent;color:var(--blue);padding:4px 0;border-radius:0}
    #toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:11px 14px;border-radius:10px;display:none;z-index:40;box-shadow:0 12px 30px rgba(15,23,42,.25)}
    @media(max-width:980px){
      .appShell{grid-template-columns:1fr}.side{position:static}.sideTitle{display:none}
      #navMenu{display:flex;gap:6px;overflow:auto}.navBtn{width:auto;white-space:nowrap}
    }
    @media(max-width:780px){
      .grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}header{padding:0 12px}
      .workspaceHead{padding:14px}.workspaceHead h1{font-size:20px}.pageIntro{align-items:flex-start;flex-direction:column}
      .card{padding:16px}
      .quoteItemRow{grid-template-columns:1fr 1fr}.quoteItemRow .descField{grid-column:1/-1}.quoteItemRow .removeItem{width:100%}
    }
  </style>
</head>
<body>
<header>
  <div><div class="brand">QuoteFlow Cloud</div><div class="sub">PlusAlpha / Supabase Staging</div></div>
  <div class="row">
    <span id="dbBadge" class="pill">接続確認中</span>
    <span id="userBadge" class="pill hidden"></span>
    <button id="logoutBtn" class="ghost hidden">ログアウト</button>
  </div>
</header>

<main class="wrap">
  <section id="loginView" class="card login">
    <h1>ログイン</h1>
    <p class="muted">QuoteFlow Cloud のアカウントでログインしてください。</p>
    <div id="loginMsg" class="notice hidden"></div>
    <form id="loginForm">
      <div class="field"><label>メールアドレス</label><input id="email" type="email" required autocomplete="username"></div>
      <div class="field"><label>パスワード</label><input id="password" type="password" required autocomplete="current-password"></div>
      <label class="row" style="margin:10px 0 14px"><input id="trustDevice" type="checkbox"> この端末を信頼する</label>
      <p class="muted" style="margin-top:-6px">信頼済み端末ではログイン状態を保持します。共有端末ではチェックを外してください。</p>
      <button class="primary" style="width:100%" type="submit">ログイン</button>
    </form>
  </section>

  <section id="mfaView" class="card login hidden">
    <h1>MFA認証</h1>
    <p class="muted">QuoteFlow Cloud は全アカウントで多要素認証が必須です。</p>
    <div id="mfaMsg" class="notice hidden"></div>
    <div id="mfaEnrollBox">
      <button id="enrollBtn" class="primary" type="button">Authenticatorを登録</button>
      <div id="qrWrap" class="hidden" style="margin-top:14px">
        <img id="qr" alt="MFA QR" style="max-width:220px">
        <p id="secret" class="muted"></p>
      </div>
    </div>
    <div class="field"><label>6桁コード</label><input id="mfaCode" inputmode="numeric" autocomplete="one-time-code"></div>
    <button id="verifyBtn" class="primary" type="button">認証する</button>
  </section>

  <section id="appView" class="hidden">
    <div class="appShell">
      <aside class="side">
        <div class="sideTitle">MENU</div>
        <nav id="navMenu"></nav>
      </aside>
      <div class="workspace">
        <div class="workspaceHead">
          <div class="row between">
            <div>
              <h1 id="pageTitle"></h1>
              <div class="meta"><span id="companyName"></span><span id="currentPageName"></span></div>
            </div>
            <div id="integrations" class="row"></div>
          </div>
        </div>
        <div id="home"></div>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const TRUST_DEVICE_KEY = 'quoteflow_trusted_device';
  const AUTH_STORAGE_KEY = 'sb-dqtqoghnctdqoljxbjjz-auth-token';
  const trustedDevice = () => localStorage.getItem(TRUST_DEVICE_KEY) === '1';
  const authStorage = {
    getItem(key){
      if(trustedDevice()) return localStorage.getItem(key);
      return sessionStorage.getItem(key);
    },
    setItem(key,value){
      if(trustedDevice()){
        localStorage.setItem(key,value);
        sessionStorage.removeItem(key);
      }else{
        sessionStorage.setItem(key,value);
        localStorage.removeItem(key);
      }
    },
    removeItem(key){
      localStorage.removeItem(key);
      sessionStorage.removeItem(key);
    }
  };

  if(!trustedDevice()){
    localStorage.removeItem(AUTH_STORAGE_KEY);
  }

  const supabase = createClient(
    "https://dqtqoghnctdqoljxbjjz.supabase.co",
    "sb_publishable_J8rfoe8B1YGnEA_xua5Ppw_Nu4T4wc5",
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: authStorage
      }
    }
  );

  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const roleLabel = (r) => ({internal_admin:'自社管理者',internal_staff:'自社スタッフ',support_staff:'サポート会社',customer_user:'顧客会社'}[r] || r || '不明');
  const money = (v) => new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(v || 0));
  const dateText = (v) => v ? new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v)) : '—';
  const statusText = (v) => ({draft:'下書き',finalized:'確定済み',sent:'送付済み',accepted:'承認済み',rejected:'却下',open:'未対応',in_progress:'対応中',resolved:'解決',closed:'完了',active:'有効',inactive:'無効',planned:'予定',delivered:'納品済み'}[v] || v || '—');
  const toast = (m) => { const e=$('#toast'); e.textContent=m; e.style.display='block'; clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>e.style.display='none',2500); };
  const show = (id) => ['loginView','mfaView','appView'].forEach(x => $('#'+x).classList.toggle('hidden',x!==id));
  const notice = (id,msg,ok=false) => { const e=$(id); e.textContent=msg; e.className='notice '+(ok?'ok':'error'); e.classList.remove('hidden'); };
  const rpc = async (name,args={}) => { const {data,error}=await supabase.rpc(name,args); if(error) throw error; return data; };

  let bootData=null;
  let mfaState={};
  let currentPage='home';

  const pageSets = {
    internal_admin: [
      ['home','ダッシュボード'],
      ['customers','顧客'],
      ['quotes','見積'],
      ['orders','受注'],
      ['purchase_orders','発注'],
      ['deliveries','納品'],
      ['assets','契約・機器'],
      ['support','サポート'],
      ['settings','設定']
    ],
    internal_staff: [
      ['home','ダッシュボード'],
      ['customers','顧客'],
      ['quotes','見積'],
      ['orders','受注'],
      ['purchase_orders','発注'],
      ['deliveries','納品'],
      ['assets','契約・機器'],
      ['support','サポート']
    ],
    support_staff: [
      ['home','ダッシュボード'],
      ['support','サポート']
    ],
    customer_user: [
      ['home','ホーム'],
      ['quotes','見積'],
      ['orders','受注'],
      ['deliveries','納品'],
      ['assets','契約・機器'],
      ['support','問い合わせ']
    ]
  };

  function kpis(items){
    return '<div class="grid">'+items.map(([l,v])=>'<div class="kpi"><div class="label">'+esc(l)+'</div><div class="value">'+esc(v??0)+'</div></div>').join('')+'</div>';
  }

  function pageIntro(title,desc){
    return '<div class="pageIntro"><div><h2>'+esc(title)+'</h2><p>'+esc(desc||'')+'</p></div></div>';
  }

  function dataTable(headers,rows){
    if(!rows.length) return '<div class="empty">表示できるデータはまだありません。</div>';
    return '<div class="tableWrap"><table><thead><tr>'+
      headers.map(h=>'<th>'+esc(h)+'</th>').join('')+
      '</tr></thead><tbody>'+
      rows.join('')+
      '</tbody></table></div>';
  }

  function integrations(){
    const map={callconnect:'CallConnect',ai:'AI',teamviewer:'TeamViewer'};
    const i=bootData?.integrations||{};
    $('#integrations').innerHTML=Object.entries(map).map(([k,l])=>{
      const st=i[k]?.state||'disabled', good=st==='connected';
      const txt={connected:'接続済み',degraded:'一部障害',manual:'手動運用',disabled:'未接続'}[st]||st;
      return '<span class="pill '+(good?'good':'bad')+'">'+l+' : '+txt+'</span>';
    }).join('');
  }

  function renderNav(){
    const role=bootData?.context?.role;
    const pages=pageSets[role]||[['home','ホーム']];
    $('#navMenu').innerHTML=pages.map(([id,label])=>'<button class="navBtn" data-page="'+id+'">'+esc(label)+'</button>').join('');
    document.querySelectorAll('.navBtn').forEach(btn=>{
      btn.onclick=()=>go(btn.dataset.page);
    });
  }

  function setActiveNav(){
    document.querySelectorAll('.navBtn').forEach(btn=>btn.classList.toggle('active',btn.dataset.page===currentPage));
    const role=bootData?.context?.role;
    const found=(pageSets[role]||[]).find(x=>x[0]===currentPage);
    $('#currentPageName').textContent=found ? ' / '+found[1] : '';
  }

  async function renderHome(){
    const role=bootData.context?.role;
    const home=$('#home');

    if(role==='internal_admin'||role==='internal_staff'){
      const [cc,q,biz]=await Promise.all([
        rpc('internal_command_center'),
        rpc('internal_handoff_queue'),
        rpc('internal_business_dashboard')
      ]);

      const quoteRows=(biz.quote_queue||[]).map(x=>
        '<tr>'+
          '<td>'+esc(x.quote_number||'下書き')+'</td>'+
          '<td>'+esc(x.customer_name||'')+'</td>'+
          '<td>'+esc(statusText(x.status))+'</td>'+
          '<td class="amount">'+esc(money(x.total_amount))+'</td>'+
        '</tr>'
      );
      const orderRows=(biz.order_queue||[]).map(x=>
        '<tr>'+
          '<td>'+esc(x.order_number||'未採番')+'</td>'+
          '<td>'+esc(x.customer_name||'')+'</td>'+
          '<td>'+esc(statusText(x.status))+'</td>'+
          '<td>'+(x.has_purchase_order?'発注あり':'<span class="hold">発注未作成</span>')+'</td>'+
          '<td>'+(x.has_delivery?'納品あり':'<span class="hold">納品未作成</span>')+'</td>'+
        '</tr>'
      );
      const deliveryRows=(biz.delivery_queue||[]).map(x=>
        '<tr>'+
          '<td>'+esc(x.delivery_number||'未採番')+'</td>'+
          '<td>'+esc(x.customer_name||'')+'</td>'+
          '<td>'+esc(x.order_number||'—')+'</td>'+
          '<td>'+esc(dateText(x.scheduled_at))+'</td>'+
          '<td>'+(x.is_overdue?'<span class="hold">予定超過</span>':esc(statusText(x.status)))+'</td>'+
        '</tr>'
      );
      const ticketRows=(biz.ticket_queue||[]).map(x=>
        '<tr>'+
          '<td>'+esc(x.ticket_number||'—')+'</td>'+
          '<td>'+esc(x.customer_name||'')+'</td>'+
          '<td>'+esc(x.subject||'')+'</td>'+
          '<td>'+esc(x.priority||'normal')+'</td>'+
          '<td>'+esc(statusText(x.status))+'</td>'+
        '</tr>'
      );

      home.innerHTML=
        pageIntro('ダッシュボード','見積から受注・発注・納品・サポートまで、今日確認が必要な項目をまとめています。')+
        kpis([
          ['見積下書き',biz.kpis?.quote_drafts],
          ['顧客回答待ち',biz.kpis?.quotes_waiting_customer],
          ['受注化待ち',biz.kpis?.accepted_quotes_without_order],
          ['発注未作成',biz.kpis?.orders_without_purchase_order],
          ['納品未作成',biz.kpis?.orders_without_delivery],
          ['納品予定超過',biz.kpis?.deliveries_overdue],
          ['対応中問い合わせ',biz.kpis?.open_tickets],
          ['手動ホールド',biz.kpis?.manual_hold_customers]
        ])+
        '<section class="card section">'+
          '<div class="row between"><div><h2>見積キュー</h2><p class="sectionDesc">下書き・顧客回答待ち・承諾済みを確認します。</p></div><button class="ghost dashGo" data-page="quotes" type="button">見積を開く</button></div>'+
          dataTable(['見積番号','顧客','状態','合計'],quoteRows)+
        '</section>'+
        '<section class="card section">'+
          '<div class="row between"><div><h2>受注キュー</h2><p class="sectionDesc">発注・納品の未作成を確認します。</p></div><button class="ghost dashGo" data-page="orders" type="button">受注を開く</button></div>'+
          dataTable(['受注番号','顧客','状態','発注','納品'],orderRows)+
        '</section>'+
        '<section class="card section">'+
          '<div class="row between"><div><h2>納品予定</h2><p class="sectionDesc">予定日順。予定超過を優先して確認します。</p></div><button class="ghost dashGo" data-page="deliveries" type="button">納品を開く</button></div>'+
          dataTable(['納品番号','顧客','受注番号','予定日','状態'],deliveryRows)+
        '</section>'+
        '<section class="card section">'+
          '<div class="row between"><div><h2>サポート</h2><p class="sectionDesc">未完了の問い合わせを確認します。</p></div><button class="ghost dashGo" data-page="support" type="button">サポートを開く</button></div>'+
          dataTable(['番号','顧客','件名','優先度','状態'],ticketRows)+
        '</section>'+
        '<section class="card section"><h2>引き継ぎキュー</h2>'+
          ((q||[]).length?(q||[]).map(h=>
            '<div class="item"><h3>'+esc(h.ticket_number||'')+' '+esc(h.customer_name||'')+'</h3><p>'+esc(h.subject||'')+'</p><p>理由: '+esc(h.reason||'')+'</p><p>次: '+esc(h.next_action||'')+'</p><button class="primary accept" data-id="'+esc(h.id)+'">受理する</button></div>'
          ).join(''):'<p class="muted">未処理の引き継ぎはありません。</p>')+
        '</section>';

      document.querySelectorAll('.dashGo').forEach(b=>b.onclick=()=>go(b.dataset.page));
      document.querySelectorAll('.accept').forEach(b=>b.onclick=async()=>{
        try{
          await rpc('accept_ticket_handoff',{p_handoff_id:b.dataset.id});
          toast('引き継ぎを受理しました');
          await renderHome();
        }catch(e){toast(e.message||String(e));}
      });
      return;
    }

    if(role==='support_staff'){
      const h=await rpc('support_home');
      home.innerHTML=
        pageIntro('サポートダッシュボード','担当案件と緊急度を確認できます。')+
        kpis([
          ['対応中',h.kpis?.open_tickets],
          ['本日新規',h.kpis?.created_today],
          ['本日解決',h.kpis?.closed_today],
          ['緊急',h.kpis?.urgent_open]
        ])+
        '<section class="card section"><h2>担当案件</h2>'+
        ((h.recent_tickets||[]).length?'<div class="tableWrap"><table><thead><tr><th>番号</th><th>顧客</th><th>件名</th><th>状態</th></tr></thead><tbody>'+(h.recent_tickets||[]).map(t=>'<tr><td>'+esc(t.ticket_number||'—')+'</td><td>'+esc(t.customer_name||'')+'</td><td>'+esc(t.subject||'')+'</td><td>'+esc(statusText(t.status))+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">担当案件はありません。</p>')+
        '</section>';
      return;
    }

    const [h,ops]=await Promise.all([rpc('customer_portal_home'),rpc('customer_operations_home')]);
    const open=(h.recent_tickets||[]).filter(t=>t.status!=='closed').length;
    const planned=(ops.deliveries||[]).filter(d=>d.status==='planned'&&!d.delivered_at).length;
    const recentDeliveries=(ops.deliveries||[]).slice(0,5).map(d=>
      '<tr><td>'+esc(d.delivery_number||'未採番')+'</td><td>'+esc(statusText(d.status))+'</td><td>'+esc(dateText(d.scheduled_at))+'</td><td>'+esc(dateText(d.delivered_at))+'</td></tr>'
    );
    home.innerHTML=

  function readQuoteItems(container){
    const rows=[...container.querySelectorAll('[data-quote-item-row]')];
    if(!rows.length) throw new Error('明細を1件以上登録してください。');
    return rows.map((row,index)=>{
      const description=row.querySelector('.qi-desc').value.trim();
      const quantity=Number(row.querySelector('.qi-qty').value||0);
      const unit_price=Number(row.querySelector('.qi-unit').value||0);
      const cost_price=Number(row.querySelector('.qi-cost').value||0);
      if(!description) throw new Error((index+1)+'行目の明細名を入力してください。');
      if(quantity<0||unit_price<0||cost_price<0) throw new Error('数量・単価・原価は0以上で入力してください。');
      return {description,quantity,unit_price,cost_price};
    });
  }

  function bindQuoteItems(container,addButton){
    const bindRemove=()=>{
      container.querySelectorAll('.removeItem').forEach(btn=>{
        btn.onclick=()=>{
          const rows=container.querySelectorAll('[data-quote-item-row]');
          if(rows.length<=1){ toast('明細は1件以上必要です'); return; }
          btn.closest('[data-quote-item-row]').remove();
        };
      });
    };
    addButton.onclick=()=>{
      container.insertAdjacentHTML('beforeend',quoteItemRow());
      bindRemove();
    };
    bindRemove();
  }

  async function renderTicketDetail(ticketId){
    const role=bootData.context?.role;
    const customer=role==='customer_user';
    const internal=role==='internal_admin'||role==='internal_staff';
    const support=role==='support_staff';

    const detail=customer
      ? await rpc('customer_ticket_detail',{p_ticket_id:ticketId})
      : await rpc('support_ticket_workspace',{p_ticket_id:ticketId});

    const t=detail?.ticket;
    if(!t) throw new Error('問い合わせが見つかりません。');

    const messages=detail.messages||[];
    const attachments=detail.attachments||[];
    const handoffs=detail.handoffs||[];
    const asset=detail.asset||null;
    const contract=detail.contract||null;
    const c=detail.customer||null;

    const visibilityLabel=v=>({customer:'顧客向け',support:'サポート内',internal:'社内のみ'}[v]||v||'顧客向け');
    const messagesHtml=messages.length
      ? messages.map(m=>
          '<div class="item">'+
            '<div class="row between"><strong>'+esc(customer?'メッセージ':visibilityLabel(m.visibility))+'</strong><span class="muted">'+esc(dateText(m.created_at))+'</span></div>'+
            '<p style="white-space:pre-wrap">'+esc(m.body||'')+'</p>'+
          '</div>'
        ).join('')
      : '<div class="empty">メッセージはまだありません。</div>';

    const attachmentRows=attachments.map(a=>
      '<tr><td>'+esc(a.file_name||'—')+'</td><td>'+esc(a.visibility?visibilityLabel(a.visibility):'顧客向け')+'</td><td>'+esc(a.size_bytes||0)+'</td><td>'+esc(dateText(a.created_at))+'</td></tr>'
    );

    const handoffRows=handoffs.map(h=>
      '<tr>'+
        '<td>'+esc(h.state||'—')+'</td>'+
        '<td>'+esc(h.reason||'—')+'</td>'+
        '<td>'+esc(h.next_action||'—')+'</td>'+
        '<td>'+esc(dateText(h.created_at))+'</td>'+
        (internal?'<td>'+
          (h.state==='pending'?'<button class="linkBtn handoffAccept" data-id="'+esc(h.id)+'" type="button">受理</button>':'')+
          (h.state==='accepted'?'<button class="linkBtn handoffComplete" data-id="'+esc(h.id)+'" type="button">完了</button>':'')+
        '</td>':'')+
      '</tr>'
    );

    let visibilitySelect='';
    if(customer){
      visibilitySelect='<input type="hidden" id="ticketMessageVisibility" value="customer">';
    }else if(support){
      visibilitySelect=
        '<div class="field"><label>公開範囲</label><select id="ticketMessageVisibility">'+
          '<option value="customer">顧客向け</option>'+
          '<option value="support">サポート内</option>'+
        '</select></div>';
    }else{
      visibilitySelect=
        '<div class="field"><label>公開範囲</label><select id="ticketMessageVisibility">'+
          '<option value="customer">顧客向け</option>'+
          '<option value="support">サポート内</option>'+
          '<option value="internal">社内のみ</option>'+
        '</select></div>';
    }

    const actionButtons=!customer
      ? '<div class="row" style="margin-top:14px">'+
          (t.status==='closed'
            ? '<button id="ticketReopenBtn" class="green" type="button">問い合わせを再開</button>'
            : '<button id="ticketCloseBtn" class="green" type="button">問い合わせを完了</button>')+
          (t.status!=='closed'
            ? '<button id="ticketHandoffToggle" class="ghost" type="button">自社へ引き継ぐ</button>'
            : '')+
        '</div>'+
        (t.status!=='closed'
          ? '<div id="ticketHandoffBox" class="hidden" style="margin-top:12px">'+
              '<div class="field"><label>引き継ぎ理由</label><textarea id="handoffReason" rows="2"></textarea></div>'+
              '<div class="field"><label>次に行うこと</label><textarea id="handoffNextAction" rows="2"></textarea></div>'+
              '<button id="ticketHandoffBtn" class="orange" type="button">引き継ぎを登録</button>'+
            '</div>'
          : '')+
        '<div id="ticketActionMsg" class="notice hidden"></div>'
      : '';

    $('#ticketDetailHost').innerHTML=
      '<section class="card section">'+
        '<div class="quoteDetailHead">'+
          '<div><h2>問い合わせ詳細</h2><p class="sectionDesc">'+esc(t.ticket_number||'—')+' / '+esc(t.subject||'')+'</p></div>'+
          '<button id="ticketDetailClose" class="ghost" type="button">閉じる</button>'+
        '</div>'+
        kpis([
          ['状態',statusText(t.status)],
          ['優先度',t.priority||'normal'],
          ['作成日',dateText(t.created_at)],
          ['更新日',dateText(t.updated_at)]
        ])+
        (c?'<div class="row"><span class="pill">顧客 '+esc(c.name||'—')+'</span></div>':'')+
        '<div class="notice">'+esc(t.description||'内容なし')+'</div>'+
        '<div class="row">'+
          (asset?'<span class="pill">機器 '+esc(asset.asset_number||asset.model_name||'—')+'</span>':'')+
          (contract?'<span class="pill">契約 '+esc(contract.contract_number||'—')+'</span>':'')+
        '</div>'+
        actionButtons+
        '<section class="section">'+
          '<h3>メッセージ</h3>'+
          messagesHtml+
          '<form id="ticketMessageForm" class="card section" style="box-shadow:none">'+
            visibilitySelect+
            '<div class="field"><label>返信</label><textarea id="ticketMessageBody" rows="4" required></textarea></div>'+
            '<button class="primary" type="submit">メッセージを送信</button>'+
          '</form>'+
          '<div id="ticketMessageMsg" class="notice hidden"></div>'+
        '</section>'+
        (!customer?'<section class="section"><h3>引き継ぎ履歴</h3>'+dataTable(internal?['状態','理由','次の対応','作成日','操作']:['状態','理由','次の対応','作成日'],handoffRows)+'</section>':'')+
        '<section class="section"><h3>添付ファイル</h3>'+dataTable(['ファイル名','公開範囲','サイズ(bytes)','作成日'],attachmentRows)+'</section>'+
      '</section>';

    $('#ticketDetailClose').onclick=()=>{$('#ticketDetailHost').innerHTML='';};
    $('#ticketDetailHost').scrollIntoView({behavior:'smooth',block:'start'});

    $('#ticketMessageForm').onsubmit=async e=>{
      e.preventDefault();
      const btn=e.submitter;
      if(btn) btn.disabled=true;
      try{
        await rpc('post_ticket_message',{
          p_ticket_id:t.id,
          p_visibility:$('#ticketMessageVisibility').value,
          p_body:$('#ticketMessageBody').value.trim()
        });
        notice('#ticketMessageMsg','メッセージを送信しました。',true);
        toast('メッセージを送信しました');
        await renderTicketDetail(t.id);
      }catch(err){
        notice('#ticketMessageMsg',err.message||String(err));
      }finally{
        if(btn) btn.disabled=false;
      }
    };

    if(!customer){
      const closeBtn=$('#ticketCloseBtn');
      if(closeBtn){
        closeBtn.onclick=async()=>{
          closeBtn.disabled=true;
          try{
            await rpc('close_support_ticket',{p_ticket_id:t.id});
            toast('問い合わせを完了しました');
            await renderTicketDetail(t.id);
          }catch(err){
            notice('#ticketActionMsg',err.message||String(err));
          }finally{ closeBtn.disabled=false; }
        };
      }

      const reopenBtn=$('#ticketReopenBtn');
      if(reopenBtn){
        reopenBtn.onclick=async()=>{
          reopenBtn.disabled=true;
          try{
            await rpc('reopen_support_ticket',{p_ticket_id:t.id});
            toast('問い合わせを再開しました');
            await renderTicketDetail(t.id);
          }catch(err){
            notice('#ticketActionMsg',err.message||String(err));
          }finally{ reopenBtn.disabled=false; }
        };
      }

      const toggle=$('#ticketHandoffToggle');
      if(toggle) toggle.onclick=()=>$('#ticketHandoffBox').classList.toggle('hidden');

      const handoffBtn=$('#ticketHandoffBtn');
      if(handoffBtn){
        handoffBtn.onclick=async()=>{
          handoffBtn.disabled=true;
          try{
            await rpc('handoff_ticket_to_internal',{
              p_ticket_id:t.id,
              p_reason:$('#handoffReason').value.trim(),
              p_next_action:$('#handoffNextAction').value.trim()
            });
            toast('引き継ぎを登録しました');
            await renderTicketDetail(t.id);
          }catch(err){
            notice('#ticketActionMsg',err.message||String(err));
          }finally{ handoffBtn.disabled=false; }
        };
      }

      if(internal){
        document.querySelectorAll('.handoffAccept').forEach(btn=>{
          btn.onclick=async()=>{
            btn.disabled=true;
            try{
              await rpc('accept_ticket_handoff',{p_handoff_id:btn.dataset.id});
              toast('引き継ぎを受理しました');
              await renderTicketDetail(t.id);
            }catch(err){
              notice('#ticketActionMsg',err.message||String(err));
            }finally{ btn.disabled=false; }
          };
        });
        document.querySelectorAll('.handoffComplete').forEach(btn=>{
          btn.onclick=async()=>{
            btn.disabled=true;
            try{
              await rpc('complete_ticket_handoff',{p_handoff_id:btn.dataset.id});
              toast('引き継ぎを完了しました');
              await renderTicketDetail(t.id);
            }catch(err){
              notice('#ticketActionMsg',err.message||String(err));
            }finally{ btn.disabled=false; }
          };
        });
      }
    }
  }

  async function renderSupport(){
    const role=bootData.context?.role;
    const [{data,error},cmap]=await Promise.all([
      supabase.from('support_tickets').select('id,customer_id,ticket_number,subject,status,priority,created_at,updated_at').order('created_at',{ascending:false}),
      customerMap()
    ]);
    if(error) throw error;

    const rows=(data||[]).map(t=>{
      const c=cmap[t.customer_id]||{};
      return '<tr>'+
        '<td><strong>'+esc(t.ticket_number||'—')+'</strong></td>'+
        '<td>'+esc(c.name||'—')+'</td>'+
        '<td>'+esc(t.subject||'')+'</td>'+
        '<td>'+esc(statusText(t.status))+'</td>'+
        '<td>'+esc(t.priority||'normal')+'</td>'+
        '<td>'+esc(dateText(t.created_at))+'</td>'+
        '<td><button class="linkBtn ticketDetail" type="button" data-id="'+esc(t.id)+'">詳細</button></td>'+
      '</tr>';
    });

    let createBox='';
    if(role==='customer_user'){
      const [assetRes,contractRes]=await Promise.all([
        supabase.from('assets').select('id,asset_number,model_name,status').order('created_at',{ascending:false}),
        supabase.from('contracts').select('id,contract_number,status').order('created_at',{ascending:false})
      ]);
      if(assetRes.error) throw assetRes.error;
      if(contractRes.error) throw contractRes.error;

      const assetOptions=(assetRes.data||[]).map(a=>
        '<option value="'+esc(a.id)+'">'+esc(a.asset_number||a.model_name||'機器')+'</option>'
      ).join('');
      const contractOptions=(contractRes.data||[]).map(c=>
        '<option value="'+esc(c.id)+'">'+esc(c.contract_number||'契約')+'</option>'
      ).join('');

      createBox=
        '<section class="card section">'+
          '<h2>新しく問い合わせる</h2>'+
          '<p class="sectionDesc">必要に応じて対象の契約・機器を選択できます。</p>'+
          '<form id="ticketForm">'+
            '<div class="row">'+
              '<div class="field" style="flex:1;min-width:180px"><label>対象機器（任意）</label><select id="ticketAsset"><option value="">指定なし</option>'+assetOptions+'</select></div>'+
              '<div class="field" style="flex:1;min-width:180px"><label>対象契約（任意）</label><select id="ticketContract"><option value="">指定なし</option>'+contractOptions+'</select></div>'+
            '</div>'+
            '<div class="field"><label>件名</label><input id="subject" required></div>'+
            '<div class="field"><label>内容</label><textarea id="description" rows="4"></textarea></div>'+
            '<button class="green" type="submit">送信する</button>'+
          '</form>'+
          '<div id="ticketMsg" class="notice hidden"></div>'+
        '</section>';
    }

    $('#home').innerHTML=
      pageIntro(role==='customer_user'?'問い合わせ':'サポート','問い合わせの詳細、メッセージ、引き継ぎ状況を確認します。')+
      createBox+
      '<div id="ticketDetailHost"></div>'+
      '<section class="section">'+dataTable(['番号','顧客','件名','状態','優先度','作成日','操作'],rows)+'</section>';

    document.querySelectorAll('.ticketDetail').forEach(btn=>{
      btn.onclick=async()=>{
        btn.disabled=true;
        try{ await renderTicketDetail(btn.dataset.id); }
        catch(err){ toast(err.message||String(err)); }
        finally{ btn.disabled=false; }
      };
    });

    if(role==='customer_user'){
      $('#ticketForm').onsubmit=async e=>{
        e.preventDefault();
        const btn=e.submitter;
        if(btn) btn.disabled=true;
        try{
          await rpc('create_customer_ticket',{
            p_asset_id:$('#ticketAsset').value||null,
            p_contract_id:$('#ticketContract').value||null,
            p_subject:$('#subject').value.trim(),
            p_description:$('#description').value.trim()||null
          });
          notice('#ticketMsg','問い合わせを作成しました。',true);
          $('#ticketForm').reset();
          setTimeout(()=>go('support'),450);
        }catch(err){
          notice('#ticketMsg',err.message||String(err));
        }finally{
          if(btn) btn.disabled=false;
        }
      };
    }
  }

  async function renderAssets(){
    const role=bootData.context?.role;
    const internal=role==='internal_admin'||role==='internal_staff';

    if(internal){
      const [assets,contractRes,customers]=await Promise.all([
        rpc('internal_assets_list'),
        supabase.from('contracts')
          .select('id,customer_id,contract_number,status,start_date,end_date,created_at')
          .order('created_at',{ascending:false}),
        rpc('internal_customers_list')
      ]);
      if(contractRes.error) throw contractRes.error;

      const cmap={};
      (customers||[]).forEach(c=>cmap[c.id]=c);
      const customerOptions=(customers||[]).map(c=>
        '<option value="'+esc(c.id)+'">'+esc(c.name||c.customer_code||c.id)+'</option>'
      ).join('');

      const assetRows=(assets||[]).map(a=>
        '<tr>'+
          '<td><strong>'+esc(a.asset_number||'未採番')+'</strong></td>'+
          '<td>'+esc(a.customer?.name||'—')+'</td>'+
          '<td>'+esc(a.model_name||'—')+'</td>'+
          '<td>'+esc(a.serial_number||'—')+'</td>'+
          '<td>'+esc(statusText(a.status))+'</td>'+
          '<td>'+esc(a.open_ticket_count||0)+'</td>'+
          '<td><button class="linkBtn internalAssetDetail" type="button" data-id="'+esc(a.id)+'">詳細・編集</button></td>'+
        '</tr>'
      );
      const contractRows=(contractRes.data||[]).map(ct=>{
        const c=cmap[ct.customer_id]||{};
        return '<tr>'+
          '<td><strong>'+esc(ct.contract_number||'未採番')+'</strong></td>'+
          '<td>'+esc(c.name||'—')+'</td>'+
          '<td>'+esc(statusText(ct.status))+'</td>'+
          '<td>'+esc(dateText(ct.start_date))+'</td>'+
          '<td>'+esc(dateText(ct.end_date))+'</td>'+
          '<td><button class="linkBtn internalContractDetail" type="button" data-id="'+esc(ct.id)+'">詳細・編集</button></td>'+
        '</tr>';
      });

      $('#home').innerHTML=
        pageIntro('契約・機器','契約と機器を顧客へ紐付けて登録・編集します。状態は既存ルールに従い、新規時の既定値から開始します。')+
        '<section class="card section">'+
          '<h2>新規契約</h2>'+
          '<form id="contractCreateForm">'+
            '<div class="field"><label>顧客</label><select id="contractCustomer" required><option value="">選択してください</option>'+customerOptions+'</select></div>'+
            '<div class="field"><label>契約番号（任意）</label><input id="contractNumber"></div>'+
            '<div class="row">'+
              '<div class="field" style="flex:1;min-width:180px"><label>開始日</label><input id="contractStart" type="date"></div>'+
              '<div class="field" style="flex:1;min-width:180px"><label>終了日</label><input id="contractEnd" type="date"></div>'+
            '</div>'+
            '<div class="field"><label>社内メモ</label><textarea id="contractNote" rows="3"></textarea></div>'+
            '<button class="primary" type="submit">契約を登録</button>'+
          '</form>'+
          '<div id="contractCreateMsg" class="notice hidden"></div>'+
        '</section>'+
        '<section class="card section">'+
          '<h2>新規機器</h2>'+
          '<form id="assetCreateForm">'+
            '<div class="field"><label>顧客</label><select id="assetCustomer" required><option value="">選択してください</option>'+customerOptions+'</select></div>'+
            '<div class="row">'+
              '<div class="field" style="flex:1;min-width:180px"><label>機器番号（任意）</label><input id="assetNumber"></div>'+
              '<div class="field" style="flex:1;min-width:180px"><label>機種</label><input id="assetModel"></div>'+
            '</div>'+
            '<div class="field"><label>シリアル番号</label><input id="assetSerial"></div>'+
            '<div class="field"><label>社内メモ</label><textarea id="assetNote" rows="3"></textarea></div>'+
            '<button class="primary" type="submit">機器を登録</button>'+
          '</form>'+
          '<div id="assetCreateMsg" class="notice hidden"></div>'+
        '</section>'+
        '<div id="contractDetailHost"></div>'+
        '<div id="assetDetailHost"></div>'+
        '<section class="card section"><h2>契約</h2>'+dataTable(['契約番号','顧客','状態','開始日','終了日','操作'],contractRows)+'</section>'+
        '<section class="card section"><h2>機器</h2>'+dataTable(['機器番号','顧客','機種','シリアル','状態','対応中','操作'],assetRows)+'</section>';

      $('#contractCreateForm').onsubmit=async e=>{
        e.preventDefault();
        const btn=e.submitter;
        if(btn) btn.disabled=true;
        try{
          await rpc('create_contract',{
            p_customer_id:$('#contractCustomer').value,
            p_contract_number:$('#contractNumber').value.trim()||null,
            p_start_date:$('#contractStart').value||null,
            p_end_date:$('#contractEnd').value||null,
            p_internal_note:$('#contractNote').value.trim()||null
          });
          notice('#contractCreateMsg','契約を登録しました。',true);
          toast('契約を登録しました');
          setTimeout(()=>go('assets'),400);
        }catch(err){
          notice('#contractCreateMsg',err.message||String(err));
        }finally{
          if(btn) btn.disabled=false;
        }
      };

      $('#assetCreateForm').onsubmit=async e=>{
        e.preventDefault();
        const btn=e.submitter;
        if(btn) btn.disabled=true;
        try{
          await rpc('create_asset',{
            p_customer_id:$('#assetCustomer').value,
            p_asset_number:$('#assetNumber').value.trim()||null,
            p_serial_number:$('#assetSerial').value.trim()||null,
            p_model_name:$('#assetModel').value.trim()||null,
            p_internal_note:$('#assetNote').value.trim()||null
          });
          notice('#assetCreateMsg','機器を登録しました。',true);
          toast('機器を登録しました');
          setTimeout(()=>go('assets'),400);
        }catch(err){
          notice('#assetCreateMsg',err.message||String(err));
        }finally{
          if(btn) btn.disabled=false;
        }
      };

      document.querySelectorAll('.internalAssetDetail').forEach(btn=>{
        btn.onclick=async()=>{
          btn.disabled=true;
          try{ await renderInternalAssetDetail(btn.dataset.id); }
          catch(err){ toast(err.message||String(err)); }
          finally{ btn.disabled=false; }
        };
      });
      document.querySelectorAll('.internalContractDetail').forEach(btn=>{
        btn.onclick=async()=>{
          btn.disabled=true;
          try{ await renderInternalContractDetail(btn.dataset.id); }
          catch(err){ toast(err.message||String(err)); }
          finally{ btn.disabled=false; }
        };
      });
      return;
    }

    const [assetRes,contractRes]=await Promise.all([
      supabase.from('assets').select('id,asset_number,serial_number,model_name,status,created_at').order('created_at',{ascending:false}),
      supabase.from('contracts').select('id,contract_number,status,start_date,end_date,created_at').order('created_at',{ascending:false})
    ]);
    if(assetRes.error) throw assetRes.error;
    if(contractRes.error) throw contractRes.error;

    const assetRows=(assetRes.data||[]).map(a=>
      '<tr><td><strong>'+esc(a.asset_number||'—')+'</strong></td><td>'+esc(a.model_name||'—')+'</td><td>'+esc(a.serial_number||'—')+'</td><td>'+esc(statusText(a.status))+'</td></tr>'
    );
    const contractRows=(contractRes.data||[]).map(c=>
      '<tr><td><strong>'+esc(c.contract_number||'—')+'</strong></td><td>'+esc(statusText(c.status))+'</td><td>'+esc(dateText(c.start_date))+'</td><td>'+esc(dateText(c.end_date))+'</td></tr>'
    );

    $('#home').innerHTML=
      pageIntro('契約・機器','登録されている契約と機器を確認できます。')+
      '<section class="card section"><h2>契約</h2>'+dataTable(['契約番号','状態','開始日','終了日'],contractRows)+'</section>'+
      '<section class="card section"><h2>機器</h2>'+dataTable(['機器番号','機種','シリアル','状態'],assetRows)+'</section>';
  }

  async function go(page){
    currentPage=page;
    setActiveNav();
    $('#home').innerHTML='<div class="card section"><p class="muted">読み込み中...</p></div>';
    try{
      if(page==='home') return await renderHome();
      if(page==='customers') return await renderCustomers();
      if(page==='quotes') return await renderQuotes();
      if(page==='orders') return await renderOrders();
      if(page==='purchase_orders') return await renderPurchaseOrders();
      if(page==='deliveries') return await renderDeliveries();
      if(page==='support') return await renderSupport();
      if(page==='settings') return await renderSettings();
      if(page==='assets') return await renderAssets();
      return await renderHome();
    }catch(e){
      $('#home').innerHTML='<div class="notice error">読み込みに失敗しました: '+esc(e.message||String(e))+'</div>';
    }
  }

  async function prepareMfa(){
    show('mfaView');
    $('#mfaEnrollBox').classList.remove('hidden');
    $('#qrWrap').classList.add('hidden');
    $('#mfaMsg').classList.add('hidden');
    mfaState={};

    const aal=await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal.error) return notice('#mfaMsg',aal.error.message);
    if(aal.data?.currentLevel==='aal2'){
      return boot();
    }

    const f=await supabase.auth.mfa.listFactors();
    if(f.error) return notice('#mfaMsg',f.error.message);

    const verified=[...(f.data?.totp||[]),...(f.data?.phone||[])].find(x=>x.status==='verified');
    if(verified){
      $('#mfaEnrollBox').classList.add('hidden');
      const ch=await supabase.auth.mfa.challenge({factorId:verified.id});
      if(ch.error) return notice('#mfaMsg',ch.error.message);
      mfaState={factorId:verified.id,challengeId:ch.data.id};
      return;
    }

    notice('#mfaMsg','初回ログインのためAuthenticatorの登録が必要です。QRコードを登録後、6桁コードを入力してください。',true);
  }

  async function boot(){
    const {data:{session}}=await supabase.auth.getSession();
    if(!session){
      show('loginView');
      $('#logoutBtn').classList.add('hidden');
      $('#userBadge').classList.add('hidden');
      $('#trustDevice').checked=trustedDevice();
      return;
    }

    $('#logoutBtn').classList.remove('hidden');
    $('#userBadge').textContent=session.user.email||'ログイン中';
    $('#userBadge').classList.remove('hidden');

    const aal=await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal.error){
      show('loginView');
      notice('#loginMsg',aal.error.message);
      return;
    }
    if(aal.data?.currentLevel!=='aal2'){
      return prepareMfa();
    }

    try{
      bootData=await rpc('current_app_bootstrap');
    }catch(e){
      const m=String(e.message||e);
      if(m.toLowerCase().includes('aal2')) return prepareMfa();
      show('loginView');
      notice('#loginMsg',m);
      return;
    }

    show('appView');
    $('#pageTitle').textContent=roleLabel(bootData.context?.role);
    $('#companyName').textContent=bootData.context?.company_name||'';
    integrations();
    renderNav();
    await go('home');
  }

  $('#loginForm').onsubmit=async e=>{
    e.preventDefault();
    $('#loginMsg').classList.add('hidden');
    if($('#trustDevice').checked){
      localStorage.setItem(TRUST_DEVICE_KEY,'1');
    }else{
      localStorage.removeItem(TRUST_DEVICE_KEY);
      localStorage.removeItem(AUTH_STORAGE_KEY);
    }
    const {error}=await supabase.auth.signInWithPassword({
      email:$('#email').value.trim(),
      password:$('#password').value
    });
    if(error) return notice('#loginMsg',error.message);
    $('#password').value='';
    await boot();
  };

  $('#enrollBtn').onclick=async()=>{
    const r=await supabase.auth.mfa.enroll({factorType:'totp',friendlyName:'QuoteFlow Cloud'});
    if(r.error) return notice('#mfaMsg',r.error.message);
    const ch=await supabase.auth.mfa.challenge({factorId:r.data.id});
    if(ch.error) return notice('#mfaMsg',ch.error.message);
    mfaState={factorId:r.data.id,challengeId:ch.data.id};
    $('#qr').src=r.data.totp.qr_code;
    $('#qrWrap').classList.remove('hidden');
    $('#secret').textContent='Secret: '+r.data.totp.secret;
  };

  $('#verifyBtn').onclick=async()=>{
    let {factorId,challengeId}=mfaState;
    if(!factorId) return notice('#mfaMsg','Authenticatorを登録してください。');
    if(!challengeId){
      const ch=await supabase.auth.mfa.challenge({factorId});
      if(ch.error) return notice('#mfaMsg',ch.error.message);
      challengeId=ch.data.id;
    }
    const v=await supabase.auth.mfa.verify({
      factorId,
      challengeId,
      code:$('#mfaCode').value.trim()
    });
    if(v.error) return notice('#mfaMsg',v.error.message);
    $('#mfaCode').value='';
    const aal=await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal.error) return notice('#mfaMsg',aal.error.message);
    if(aal.data?.currentLevel!=='aal2') return notice('#mfaMsg','MFA認証を完了できませんでした。もう一度お試しください。');
    await boot();
  };

  $('#logoutBtn').onclick=async()=>{
    await supabase.auth.signOut();
    localStorage.removeItem(TRUST_DEVICE_KEY);
    localStorage.removeItem(AUTH_STORAGE_KEY);
    sessionStorage.removeItem(AUTH_STORAGE_KEY);
    bootData=null;
    currentPage='home';
    await boot();
  };

  try{
    const h=await rpc('app_health');
    $('#dbBadge').textContent=h?.ok?'DB接続 OK':'DB応答あり';
    $('#dbBadge').className='pill good';
  }catch(e){
    $('#dbBadge').textContent='DB接続エラー';
    $('#dbBadge').className='pill bad';
  }

  await boot();
</script>
