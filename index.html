<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuoteFlow Cloud</title>
  <style>
    :root{
      --navy:#07162f;--navy2:#0e2448;--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;
      --line:#dfe6f1;--blue:#2563eb;--blue2:#1d4ed8;--orange:#ea580c;--green:#059669;--red:#dc2626;
      --soft:#eef4ff;--shadow:0 10px 30px rgba(15,23,42,.06)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
    header{height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
    .brand{font-size:19px;font-weight:900}.sub{font-size:11px;opacity:.72;margin-top:2px}
    .wrap{max-width:1380px;margin:auto;padding:22px}
    .login{max-width:460px;margin:8vh auto}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
    .field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:800;color:#475569}
    .field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
    button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}
    .orange{background:var(--orange);color:#fff}.green{background:var(--green);color:#fff}
    .ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
    .hidden{display:none!important}.muted{color:var(--muted)}
    .notice{padding:12px 14px;border-radius:10px;background:#eff6ff;color:#1e3a8a;margin:12px 0}
    .error{background:#fef2f2;color:#991b1b}.ok{background:#ecfdf5;color:#065f46}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:16px 0}
    .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
    .kpi .label{font-size:12px;color:var(--muted);font-weight:800}.kpi .value{font-size:30px;font-weight:900;margin-top:6px}
    .section{margin-top:18px}.section h2{margin:0 0 6px}.sectionDesc{margin:0 0 14px;color:var(--muted);font-size:13px}
    .item{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
    .item h3{margin:0 0 5px;font-size:14px}.item p{margin:4px 0;font-size:13px;color:#475569}
    .tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
    table{width:100%;border-collapse:collapse;min-width:720px}
    th,td{padding:11px 12px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px;vertical-align:middle}
    th{color:#64748b;background:#fafcff;position:sticky;top:0}
    tr:last-child td{border-bottom:0}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#f8fafc;border:1px solid var(--line);font-size:12px;font-weight:800}
    .pill.good{background:#ecfdf5;color:#047857}.pill.bad{background:#fef2f2;color:#b91c1c}.pill.warn{background:#fff7ed;color:#c2410c}
    .appShell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
    .side{position:sticky;top:90px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
    .sideTitle{padding:8px 10px 10px;font-size:11px;font-weight:900;color:#94a3b8;letter-spacing:.08em}
    .navBtn{width:100%;display:flex;align-items:center;justify-content:flex-start;gap:10px;background:transparent;color:#334155;padding:11px 12px;margin:2px 0;border:1px solid transparent}
    .navBtn:hover{background:#f8fafc}.navBtn.active{background:var(--soft);border-color:#c7d7ff;color:#1d4ed8}
    .workspace{min-width:0}
    .workspaceHead{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px 18px;box-shadow:var(--shadow)}
    .workspaceHead h1{margin:0 0 4px;font-size:24px}.workspaceHead .meta{font-size:13px;color:var(--muted)}
    .pageIntro{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 0 10px}
    .pageIntro h2{margin:0;font-size:20px}.pageIntro p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .empty{padding:30px 16px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:14px}
    .amount{font-variant-numeric:tabular-nums;font-weight:800}
    .hold{color:#b91c1c;font-weight:900}.normal{color:#047857;font-weight:800}
    .quoteItems{display:grid;gap:10px;margin:10px 0}
    .quoteItemRow{display:grid;grid-template-columns:minmax(220px,2fr) 110px 150px 150px 44px;gap:9px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fafcff}
    .quoteItemRow .field{margin:0}.quoteItemRow .removeItem{height:42px;padding:0;background:#fff;border:1px solid #fecaca;color:#b91c1c}
    .quoteTotals{display:flex;justify-content:flex-end;gap:18px;flex-wrap:wrap;padding:12px 0;font-size:13px}.quoteTotals strong{font-size:18px}
    .quoteDetailHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
    .linkBtn{background:transparent;color:var(--blue);padding:4px 0;border-radius:0}
    #toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:11px 14px;border-radius:10px;display:none;z-index:40;box-shadow:0 12px 30px rgba(15,23,42,.25)}
    @media(max-width:980px){
      .appShell{grid-template-columns:1fr}.side{position:static}.sideTitle{display:none}
      #navMenu{display:flex;gap:6px;overflow:auto}.navBtn{width:auto;white-space:nowrap}
    }
    @media(max-width:780px){
      .grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}header{padding:0 12px}
      .workspaceHead{padding:14px}.workspaceHead h1{font-size:20px}.pageIntro{align-items:flex-start;flex-direction:column}
      .card{padding:16px}
      .quoteItemRow{grid-template-columns:1fr 1fr}.quoteItemRow .descField{grid-column:1/-1}.quoteItemRow .removeItem{width:100%}
    }
  </style>
</head>
<body>
<header>
  <div><div class="brand">QuoteFlow Cloud</div><div class="sub">PlusAlpha / Supabase Staging</div></div>
  <div class="row">
    <span id="dbBadge" class="pill">接続確認中</span>
    <span id="userBadge" class="pill hidden"></span>
    <button id="logoutBtn" class="ghost hidden">ログアウト</button>
  </div>
</header>

<main class="wrap">
  <section id="loginView" class="card login">
    <h1>ログイン</h1>
    <p class="muted">QuoteFlow Cloud のアカウントでログインしてください。</p>
    <div id="loginMsg" class="notice hidden"></div>
    <form id="loginForm">
      <div class="field"><label>メールアドレス</label><input id="email" type="email" required autocomplete="username"></div>
      <div class="field"><label>パスワード</label><input id="password" type="password" required autocomplete="current-password"></div>
      <button class="primary" style="width:100%" type="submit">ログイン</button>
    </form>
  </section>

  <section id="mfaView" class="card login hidden">
    <h1>管理者MFA</h1>
    <p class="muted">自社管理者は追加認証が必要です。</p>
    <div id="mfaMsg" class="notice hidden"></div>
    <div id="mfaEnrollBox">
      <button id="enrollBtn" class="primary" type="button">Authenticatorを登録</button>
      <div id="qrWrap" class="hidden" style="margin-top:14px">
        <img id="qr" alt="MFA QR" style="max-width:220px">
        <p id="secret" class="muted"></p>
      </div>
    </div>
    <div class="field"><label>6桁コード</label><input id="mfaCode" inputmode="numeric" autocomplete="one-time-code"></div>
    <button id="verifyBtn" class="primary" type="button">認証する</button>
  </section>

  <section id="appView" class="hidden">
    <div class="appShell">
      <aside class="side">
        <div class="sideTitle">MENU</div>
        <nav id="navMenu"></nav>
      </aside>
      <div class="workspace">
        <div class="workspaceHead">
          <div class="row between">
            <div>
              <h1 id="pageTitle"></h1>
              <div class="meta"><span id="companyName"></span><span id="currentPageName"></span></div>
            </div>
            <div id="integrations" class="row"></div>
          </div>
        </div>
        <div id="home"></div>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabase = createClient(
    "https://dqtqoghnctdqoljxbjjz.supabase.co",
    "sb_publishable_J8rfoe8B1YGnEA_xua5Ppw_Nu4T4wc5",
    { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
  );

  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const roleLabel = (r) => ({internal_admin:'自社管理者',internal_staff:'自社スタッフ',support_staff:'サポート会社',customer_user:'顧客会社'}[r] || r || '不明');
  const money = (v) => new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(v || 0));
  const dateText = (v) => v ? new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v)) : '—';
  const statusText = (v) => ({draft:'下書き',finalized:'確定済み',sent:'送付済み',accepted:'承認済み',rejected:'却下',open:'未対応',in_progress:'対応中',resolved:'解決',closed:'完了',active:'有効',inactive:'無効'}[v] || v || '—');
  const toast = (m) => { const e=$('#toast'); e.textContent=m; e.style.display='block'; clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>e.style.display='none',2500); };
  const show = (id) => ['loginView','mfaView','appView'].forEach(x => $('#'+x).classList.toggle('hidden',x!==id));
  const notice = (id,msg,ok=false) => { const e=$(id); e.textContent=msg; e.className='notice '+(ok?'ok':'error'); e.classList.remove('hidden'); };
  const rpc = async (name,args={}) => { const {data,error}=await supabase.rpc(name,args); if(error) throw error; return data; };

  let bootData=null;
  let mfaState={};
  let currentPage='home';

  const pageSets = {
    internal_admin: [
      ['home','ダッシュボード'],
      ['customers','顧客'],
      ['quotes','見積'],
      ['orders','受注'],
      ['support','サポート'],
      ['settings','設定']
    ],
    internal_staff: [
      ['home','ダッシュボード'],
      ['customers','顧客'],
      ['quotes','見積'],
      ['orders','受注'],
      ['support','サポート']
    ],
    support_staff: [
      ['home','ダッシュボード'],
      ['support','サポート']
    ],
    customer_user: [
      ['home','ホーム'],
      ['quotes','見積'],
      ['assets','契約・機器'],
      ['support','問い合わせ']
    ]
  };

  function kpis(items){
    return '<div class="grid">'+items.map(([l,v])=>'<div class="kpi"><div class="label">'+esc(l)+'</div><div class="value">'+esc(v??0)+'</div></div>').join('')+'</div>';
  }

  function pageIntro(title,desc){
    return '<div class="pageIntro"><div><h2>'+esc(title)+'</h2><p>'+esc(desc||'')+'</p></div></div>';
  }

  function dataTable(headers,rows){
    if(!rows.length) return '<div class="empty">表示できるデータはまだありません。</div>';
    return '<div class="tableWrap"><table><thead><tr>'+
      headers.map(h=>'<th>'+esc(h)+'</th>').join('')+
      '</tr></thead><tbody>'+
      rows.join('')+
      '</tbody></table></div>';
  }

  function integrations(){
    const map={callconnect:'CallConnect',ai:'AI',teamviewer:'TeamViewer'};
    const i=bootData?.integrations||{};
    $('#integrations').innerHTML=Object.entries(map).map(([k,l])=>{
      const st=i[k]?.state||'disabled', good=st==='connected';
      const txt={connected:'接続済み',degraded:'一部障害',manual:'手動運用',disabled:'未接続'}[st]||st;
      return '<span class="pill '+(good?'good':'bad')+'">'+l+' : '+txt+'</span>';
    }).join('');
  }

  function renderNav(){
    const role=bootData?.context?.role;
    const pages=pageSets[role]||[['home','ホーム']];
    $('#navMenu').innerHTML=pages.map(([id,label])=>'<button class="navBtn" data-page="'+id+'">'+esc(label)+'</button>').join('');
    document.querySelectorAll('.navBtn').forEach(btn=>{
      btn.onclick=()=>go(btn.dataset.page);
    });
  }

  function setActiveNav(){
    document.querySelectorAll('.navBtn').forEach(btn=>btn.classList.toggle('active',btn.dataset.page===currentPage));
    const role=bootData?.context?.role;
    const found=(pageSets[role]||[]).find(x=>x[0]===currentPage);
    $('#currentPageName').textContent=found ? ' / '+found[1] : '';
  }

  async function renderHome(){
    const role=bootData.context?.role;
    const home=$('#home');

    if(role==='internal_admin'||role==='internal_staff'){
      const [cc,q]=await Promise.all([rpc('internal_command_center'),rpc('internal_handoff_queue')]);
      home.innerHTML=
        pageIntro('ダッシュボード','今日確認が必要な項目をまとめています。')+
        kpis([
          ['緊急問い合わせ',cc.now_action?.urgent_open_tickets],
          ['未割当',cc.now_action?.unassigned_open_tickets],
          ['未処理引き継ぎ',cc.now_action?.pending_handoffs],
          ['手動ホールド',cc.now_action?.manual_hold_customers]
        ])+
        '<section class="card section"><h2>引き継ぎキュー</h2>'+
        ((q||[]).length?(q||[]).map(h=>'<div class="item"><h3>'+esc(h.ticket_number||'')+' '+esc(h.customer_name||'')+'</h3><p>'+esc(h.subject||'')+'</p><p>理由: '+esc(h.reason||'')+'</p><p>次: '+esc(h.next_action||'')+'</p><button class="primary accept" data-id="'+esc(h.id)+'">受理する</button></div>').join(''):'<p class="muted">未処理の引き継ぎはありません。</p>')+
        '</section>';
      document.querySelectorAll('.accept').forEach(b=>b.onclick=async()=>{
        try{
          await rpc('accept_ticket_handoff',{p_handoff_id:b.dataset.id});
          toast('引き継ぎを受理しました');
          await renderHome();
        }catch(e){toast(e.message||String(e));}
      });
      return;
    }

    if(role==='support_staff'){
      const h=await rpc('support_home');
      home.innerHTML=
        pageIntro('サポートダッシュボード','担当案件と緊急度を確認できます。')+
        kpis([
          ['対応中',h.kpis?.open_tickets],
          ['本日新規',h.kpis?.created_today],
          ['本日解決',h.kpis?.closed_today],
          ['緊急',h.kpis?.urgent_open]
        ])+
        '<section class="card section"><h2>担当案件</h2>'+
        ((h.recent_tickets||[]).length?'<div class="tableWrap"><table><thead><tr><th>番号</th><th>顧客</th><th>件名</th><th>状態</th></tr></thead><tbody>'+(h.recent_tickets||[]).map(t=>'<tr><td>'+esc(t.ticket_number||'—')+'</td><td>'+esc(t.customer_name||'')+'</td><td>'+esc(t.subject||'')+'</td><td>'+esc(statusText(t.status))+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">担当案件はありません。</p>')+
        '</section>';
      return;
    }

    const h=await rpc('customer_portal_home');
    const open=(h.recent_tickets||[]).filter(t=>t.status!=='closed').length;
    home.innerHTML=
      pageIntro('ホーム','見積・契約・機器・問い合わせの状況をまとめています。')+
      kpis([
        ['対応中',open],
        ['問い合わせ',(h.recent_tickets||[]).length],
        ['登録機器',(h.assets||[]).length],
        ['契約',(h.contracts||[]).length]
      ])+
      '<section class="card section"><h2>最近の問い合わせ</h2>'+
      ((h.recent_tickets||[]).length?'<div class="tableWrap"><table><thead><tr><th>番号</th><th>件名</th><th>状態</th></tr></thead><tbody>'+(h.recent_tickets||[]).map(t=>'<tr><td>'+esc(t.ticket_number||'—')+'</td><td>'+esc(t.subject||'')+'</td><td>'+esc(statusText(t.status))+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">問い合わせはまだありません。</p>')+
      '</section>';
  }

  async function renderCustomers(){
    const {data,error}=await supabase
      .from('customers')
      .select('id,customer_code,name,phone,status,manual_hold,updated_at')
      .order('name',{ascending:true});
    if(error) throw error;
    const rows=(data||[]).map(c=>
      '<tr>'+
        '<td>'+esc(c.customer_code||'—')+'</td>'+
        '<td><strong>'+esc(c.name)+'</strong></td>'+
        '<td>'+esc(c.phone||'—')+'</td>'+
        '<td>'+esc(statusText(c.status))+'</td>'+
        '<td>'+(c.manual_hold?'<span class="hold">手動ホールド中</span>':'<span class="normal">通常</span>')+'</td>'+
        '<td>'+esc(dateText(c.updated_at))+'</td>'+
      '</tr>'
    );
    $('#home').innerHTML=
      pageIntro('顧客','顧客マスタと取引停止状態を確認します。')+
      dataTable(['顧客コード','顧客名','電話','状態','取引状態','更新日'],rows);
  }

  async function customerMap(){
    const {data,error}=await supabase.from('customers').select('id,name,customer_code');
    if(error) throw error;
    const map={};
    (data||[]).forEach(c=>map[c.id]=c);
    return map;
  }

  function quoteItemRow(item={}){
    return '<div class="quoteItemRow" data-quote-item-row>'+
      '<div class="field descField"><label>明細名</label><input class="qi-desc" required value="'+esc(item.description||'')+'" placeholder="例：システム保守費用"></div>'+
      '<div class="field"><label>数量</label><input class="qi-qty" type="number" min="0" step="0.01" required value="'+esc(item.quantity ?? 1)+'"></div>'+
      '<div class="field"><label>単価</label><input class="qi-unit" type="number" min="0" step="1" required value="'+esc(item.unit_price ?? 0)+'"></div>'+
      '<div class="field"><label>原価</label><input class="qi-cost" type="number" min="0" step="1" value="'+esc(item.cost_price ?? 0)+'"></div>'+
      '<button class="removeItem" type="button" title="明細を削除">×</button>'+
    '</div>';
  }

  function readQuoteItems(container){
    const rows=[...container.querySelectorAll('[data-quote-item-row]')];
    if(!rows.length) throw new Error('明細を1件以上登録してください。');
    return rows.map((row,index)=>{
      const description=row.querySelector('.qi-desc').value.trim();
      const quantity=Number(row.querySelector('.qi-qty').value||0);
      const unit_price=Number(row.querySelector('.qi-unit').value||0);
      const cost_price=Number(row.querySelector('.qi-cost').value||0);
      if(!description) throw new Error((index+1)+'行目の明細名を入力してください。');
      if(quantity<0||unit_price<0||cost_price<0) throw new Error('数量・単価・原価は0以上で入力してください。');
      return {description,quantity,unit_price,cost_price};
    });
  }

  function bindQuoteItems(container,addButton){
    const bindRemove=()=>{
      container.querySelectorAll('.removeItem').forEach(btn=>{
        btn.onclick=()=>{
          const rows=container.querySelectorAll('[data-quote-item-row]');
          if(rows.length<=1){ toast('明細は1件以上必要です'); return; }
          btn.closest('[data-quote-item-row]').remove();
        };
      });
    };
    addButton.onclick=()=>{
      container.insertAdjacentHTML('beforeend',quoteItemRow());
      bindRemove();
    };
    bindRemove();
  }

  async function renderQuoteEditor(quoteId,cmap){
    const detail=await rpc('internal_quote_detail',{p_quote_id:quoteId});
    if(!detail?.quote) throw new Error('見積が見つかりません。');
    const q=detail.quote;
    const items=detail.items||[];
    const customer=cmap[q.customer_id]||{};
    const host=$('#quoteDetailHost');
    const editable=q.status==='draft';

    const readOnlyRows=items.map(i=>
      '<tr><td>'+esc(i.description)+'</td><td>'+esc(i.quantity)+'</td><td class="amount">'+esc(money(i.unit_price))+'</td><td class="amount">'+esc(money(Number(i.quantity||0)*Number(i.unit_price||0)))+'</td></tr>'
    );

    host.innerHTML=
      '<section class="card section">'+
        '<div class="quoteDetailHead">'+
          '<div><h2>見積詳細</h2><p class="sectionDesc">'+esc(customer.name||customer.customer_code||'')+' / '+esc(q.quote_number||'下書き')+' / '+esc(statusText(q.status))+'</p></div>'+
          '<button id="quoteDetailClose" class="ghost" type="button">閉じる</button>'+
        '</div>'+
        (editable
          ? '<form id="quoteEditForm">'+
              '<div class="row">'+
                '<div class="field" style="flex:1;min-width:180px"><label>有効期限</label><input id="quoteEditValidUntil" type="date" value="'+esc(q.valid_until||'')+'"></div>'+
                '<div class="field" style="flex:1;min-width:180px"><label>消費税額</label><input id="quoteEditTax" type="number" min="0" step="1" value="'+esc(q.tax_amount??0)+'"></div>'+
              '</div>'+
              '<div class="row between"><strong>明細</strong><button id="quoteEditAddItem" class="ghost" type="button">＋ 明細追加</button></div>'+
              '<div id="quoteEditItems" class="quoteItems">'+(items.length?items:[{}]).map(quoteItemRow).join('')+'</div>'+
              '<div class="field"><label>社内メモ</label><textarea id="quoteEditNote" rows="3">'+esc(q.internal_note||'')+'</textarea></div>'+
              '<div class="quoteTotals"><span>小計 <strong>'+esc(money(q.subtotal))+'</strong></span><span>税 <strong>'+esc(money(q.tax_amount))+'</strong></span><span>合計 <strong>'+esc(money(q.total_amount))+'</strong></span></div>'+
              '<div class="row"><button class="primary" type="submit">変更を保存</button><button id="quoteFinalizeBtn" class="green" type="button">見積を確定</button><span class="muted">確定すると自動採番され、顧客画面に表示されます。</span></div>'+
            '</form>'+
            '<div id="quoteEditMsg" class="notice hidden"></div>'
          : '<div class="quoteTotals"><span>小計 <strong>'+esc(money(q.subtotal))+'</strong></span><span>税 <strong>'+esc(money(q.tax_amount))+'</strong></span><span>合計 <strong>'+esc(money(q.total_amount))+'</strong></span></div>'+
            dataTable(['明細','数量','単価','金額'],readOnlyRows)+
            (internal && q.status==='finalized'
              ? '<div class="row" style="margin-top:14px"><button id="quoteToOrderBtn" class="orange" type="button">この見積から受注を作成</button><span class="muted">同じ見積から重複受注は作成されません。</span></div><div id="quoteActionMsg" class="notice hidden"></div>'
              : '')
        )+
      '</section>';

    $('#quoteDetailClose').onclick=()=>{ host.innerHTML=''; };
    host.scrollIntoView({behavior:'smooth',block:'start'});

    if(editable){
      const itemsBox=$('#quoteEditItems');
      bindQuoteItems(itemsBox,$('#quoteEditAddItem'));
      $('#quoteEditForm').onsubmit=async e=>{
        e.preventDefault();
        const submit=e.submitter;
        if(submit) submit.disabled=true;
        try{
          const updated=await rpc('update_draft_quote',{
            p_quote_id:q.id,
            p_valid_until:$('#quoteEditValidUntil').value||null,
            p_tax_amount:Number($('#quoteEditTax').value||0),
            p_internal_note:$('#quoteEditNote').value.trim()||null,
            p_items:readQuoteItems(itemsBox)
          });
          notice('#quoteEditMsg','保存しました。合計 '+money(updated?.total_amount||0),true);
          toast('見積を更新しました');
          setTimeout(()=>go('quotes'),450);
        }catch(err){
          notice('#quoteEditMsg',err.message||String(err));
        }finally{
          if(submit) submit.disabled=false;
        }
      };

      $('#quoteFinalizeBtn').onclick=async()=>{
        const btn=$('#quoteFinalizeBtn');
        btn.disabled=true;
        try{
          const finalized=await rpc('finalize_quote',{p_quote_id:q.id});
          notice('#quoteEditMsg','確定しました。見積番号 '+String(finalized?.quote_number||''),true);
          toast('見積を確定しました');
          setTimeout(()=>go('quotes'),500);
        }catch(err){
          const msg=String(err.message||err);
          notice('#quoteEditMsg',msg.includes('numbering configuration required')?'採番設定が未設定です。管理者の「設定」から見積番号の形式を登録してください。':msg);
        }finally{
          btn.disabled=false;
        }
      };
    }else if(internal && q.status==='finalized' && $('#quoteToOrderBtn')){
      $('#quoteToOrderBtn').onclick=async()=>{
        const btn=$('#quoteToOrderBtn');
        btn.disabled=true;
        try{
          const order=await rpc('convert_quote_to_order',{p_quote_id:q.id});
          notice('#quoteActionMsg','受注を作成しました。受注番号 '+String(order?.order_number||''),true);
          toast(order?.already_exists?'既存の受注を表示しました':'受注を作成しました');
        }catch(err){
          const msg=String(err.message||err);
          notice('#quoteActionMsg',msg.includes('numbering configuration required')?'採番設定が未設定です。管理者の「設定」から受注番号の形式を登録してください。':msg);
        }finally{
          btn.disabled=false;
        }
      };
    }
  }

  async function renderQuotes(){
    const role=bootData.context?.role;
    const internal=role==='internal_admin'||role==='internal_staff';
    const [{data,error},cmap]=await Promise.all([
      supabase.from('quotes').select('id,customer_id,quote_number,status,subtotal,tax_amount,total_amount,valid_until,created_at').order('created_at',{ascending:false}),
      customerMap()
    ]);
    if(error) throw error;

    const customerOptions=Object.entries(cmap)
      .map(([id,c])=>'<option value="'+esc(id)+'">'+esc(c.name||c.customer_code||id)+'</option>')
      .join('');

    const createBox=internal
      ? '<section class="card section">'+
          '<h2>新規見積</h2>'+
          '<p class="sectionDesc">下書きとして保存します。明細は複数行追加できます。</p>'+
          '<form id="quoteForm">'+
            '<div class="field"><label>顧客</label><select id="quoteCustomer" required><option value="">選択してください</option>'+customerOptions+'</select></div>'+
            '<div class="row">'+
              '<div class="field" style="flex:1;min-width:180px"><label>有効期限</label><input id="quoteValidUntil" type="date"></div>'+
              '<div class="field" style="flex:1;min-width:180px"><label>消費税額</label><input id="quoteTax" type="number" min="0" step="1" value="0"></div>'+
            '</div>'+
            '<div class="row between"><strong>明細</strong><button id="quoteAddItem" class="ghost" type="button">＋ 明細追加</button></div>'+
            '<div id="quoteCreateItems" class="quoteItems">'+quoteItemRow()+'</div>'+
            '<div class="field"><label>社内メモ</label><textarea id="quoteNote" rows="3"></textarea></div>'+
            '<button class="primary" type="submit">下書きを作成</button>'+
          '</form>'+
          '<div id="quoteMsg" class="notice hidden"></div>'+
        '</section>'
      : '';

    const rows=(data||[]).map(q=>{
      const c=cmap[q.customer_id]||{};
      return '<tr>'+
        '<td><strong>'+esc(q.quote_number||'下書き')+'</strong></td>'+
        '<td>'+esc(c.name||'—')+'</td>'+
        '<td>'+esc(statusText(q.status))+'</td>'+
        '<td class="amount">'+esc(money(q.total_amount))+'</td>'+
        '<td>'+esc(dateText(q.valid_until))+'</td>'+
        '<td>'+esc(dateText(q.created_at))+'</td>'+
        (internal?'<td><button class="linkBtn quoteEdit" type="button" data-id="'+esc(q.id)+'">詳細・編集</button></td>':'')+
      '</tr>';
    });

    $('#home').innerHTML=
      pageIntro('見積','権限のある見積だけが表示されます。')+
      createBox+
      '<div id="quoteDetailHost"></div>'+
      '<section class="section">'+dataTable(
        internal?['見積番号','顧客','状態','合計','有効期限','作成日','操作']:['見積番号','顧客','状態','合計','有効期限','作成日'],
        rows
      )+'</section>';

    if(internal){
      const createItems=$('#quoteCreateItems');
      bindQuoteItems(createItems,$('#quoteAddItem'));

      $('#quoteForm').onsubmit=async e=>{
        e.preventDefault();
        const submit=e.submitter;
        if(submit) submit.disabled=true;
        try{
          const created=await rpc('create_draft_quote',{
            p_customer_id:$('#quoteCustomer').value,
            p_valid_until:$('#quoteValidUntil').value||null,
            p_tax_amount:Number($('#quoteTax').value||0),
            p_internal_note:$('#quoteNote').value.trim()||null,
            p_items:readQuoteItems(createItems)
          });
          notice('#quoteMsg','見積の下書きを作成しました。合計 '+money(created?.total_amount||0),true);
          toast('見積を作成しました');
          setTimeout(()=>go('quotes'),450);
        }catch(err){
          notice('#quoteMsg',err.message||String(err));
        }finally{
          if(submit) submit.disabled=false;
        }
      };

      document.querySelectorAll('.quoteEdit').forEach(btn=>{
        btn.onclick=async()=>{
          btn.disabled=true;
          try{
            await renderQuoteEditor(btn.dataset.id,cmap);
          }catch(err){
            toast(err.message||String(err));
          }finally{
            btn.disabled=false;
          }
        };
      });
    }
  }

  async function renderSettings(){
    const role=bootData.context?.role;
    if(role!=='internal_admin') throw new Error('管理者のみ利用できます。');

    const cfg=await rpc('internal_numbering_settings');
    const quote=cfg?.quote||{};
    const order=cfg?.order||{};

    $('#home').innerHTML=
      pageIntro('設定','見積番号・受注番号の採番形式を設定します。')+
      '<section class="card section">'+
        '<h2>自動採番</h2>'+
        '<p class="sectionDesc">形式は運用ルールに合わせて入力してください。未設定の間は見積確定・受注化を実行できません。</p>'+
        '<form id="numberingForm">'+
          '<div class="field"><label>見積番号の形式</label><input id="quotePattern" value="'+esc(quote.pattern||'')+'" placeholder="例: Q-{YYYY}-{SEQ4}"></div>'+
          '<div class="field"><label>見積番号の次回連番</label><input id="quoteStart" type="number" min="1" step="1" value="'+esc(quote.next_sequence||1)+'"></div>'+
          '<div class="field"><label>受注番号の形式</label><input id="orderPattern" value="'+esc(order.pattern||'')+'" placeholder="例: O-{YYYY}-{SEQ4}"></div>'+
          '<div class="field"><label>受注番号の次回連番</label><input id="orderStart" type="number" min="1" step="1" value="'+esc(order.next_sequence||1)+'"></div>'+
          '<div class="notice">使用可能: {YYYY} {YY} {MM} {DD} {SEQ} {SEQ1}〜{SEQ12}<br>入力例は説明用です。正式な番号形式として自動採用はしません。</div>'+
          '<button class="primary" type="submit">採番設定を保存</button>'+
        '</form>'+
        '<div id="numberingMsg" class="notice hidden"></div>'+
      '</section>';

    $('#numberingForm').onsubmit=async e=>{
      e.preventDefault();
      const btn=e.submitter;
      if(btn) btn.disabled=true;
      try{
        const saved=await rpc('save_numbering_settings',{
          p_quote_pattern:$('#quotePattern').value.trim()||null,
          p_quote_start:Number($('#quoteStart').value||1),
          p_order_pattern:$('#orderPattern').value.trim()||null,
          p_order_start:Number($('#orderStart').value||1)
        });
        notice('#numberingMsg','採番設定を保存しました。',true);
        $('#quotePattern').value=saved?.quote?.pattern||'';
        $('#quoteStart').value=saved?.quote?.next_sequence||1;
        $('#orderPattern').value=saved?.order?.pattern||'';
        $('#orderStart').value=saved?.order?.next_sequence||1;
      }catch(err){
        notice('#numberingMsg',err.message||String(err));
      }finally{
        if(btn) btn.disabled=false;
      }
    };
  }

  async function renderOrders(){
    const [{data,error},cmap]=await Promise.all([
      supabase.from('orders').select('id,customer_id,quote_id,order_number,status,total_amount,ordered_at,created_at').order('created_at',{ascending:false}),
      customerMap()
    ]);
    if(error) throw error;
    const rows=(data||[]).map(o=>{
      const c=cmap[o.customer_id]||{};
      return '<tr>'+
        '<td><strong>'+esc(o.order_number||'未採番')+'</strong></td>'+
        '<td>'+esc(c.name||'—')+'</td>'+
        '<td>'+esc(statusText(o.status))+'</td>'+
        '<td class="amount">'+esc(money(o.total_amount))+'</td>'+
        '<td>'+esc(dateText(o.ordered_at))+'</td>'+
        '<td>'+esc(dateText(o.created_at))+'</td>'+
      '</tr>';
    });
    $('#home').innerHTML=
      pageIntro('受注','自社管理者・自社スタッフのみ閲覧できます。')+
      dataTable(['受注番号','顧客','状態','合計','受注日','作成日'],rows);
  }

  async function renderSupport(){
    const role=bootData.context?.role;
    const [{data,error},cmap]=await Promise.all([
      supabase.from('support_tickets').select('id,customer_id,ticket_number,subject,status,priority,created_at,updated_at').order('created_at',{ascending:false}),
      customerMap()
    ]);
    if(error) throw error;

    const rows=(data||[]).map(t=>{
      const c=cmap[t.customer_id]||{};
      return '<tr>'+
        '<td><strong>'+esc(t.ticket_number||'—')+'</strong></td>'+
        '<td>'+esc(c.name||'—')+'</td>'+
        '<td>'+esc(t.subject||'')+'</td>'+
        '<td>'+esc(statusText(t.status))+'</td>'+
        '<td>'+esc(t.priority||'normal')+'</td>'+
        '<td>'+esc(dateText(t.created_at))+'</td>'+
      '</tr>';
    });

    let createBox='';
    if(role==='customer_user'){
      createBox=
        '<section class="card section">'+
          '<h2>新しく問い合わせる</h2>'+
          '<p class="sectionDesc">件名と内容を入力して送信してください。</p>'+
          '<form id="ticketForm">'+
            '<div class="field"><label>件名</label><input id="subject" required></div>'+
            '<div class="field"><label>内容</label><textarea id="description" rows="4"></textarea></div>'+
            '<button class="green" type="submit">送信する</button>'+
          '</form>'+
          '<div id="ticketMsg" class="notice hidden"></div>'+
        '</section>';
    }

    $('#home').innerHTML=
      pageIntro(role==='customer_user'?'問い合わせ':'サポート','問い合わせの状況を確認します。')+
      createBox+
      '<section class="section">'+dataTable(['番号','顧客','件名','状態','優先度','作成日'],rows)+'</section>';

    if(role==='customer_user'){
      $('#ticketForm').onsubmit=async e=>{
        e.preventDefault();
        try{
          await rpc('create_customer_ticket',{
            p_asset_id:null,
            p_contract_id:null,
            p_subject:$('#subject').value.trim(),
            p_description:$('#description').value.trim()||null
          });
          notice('#ticketMsg','問い合わせを作成しました。',true);
          $('#ticketForm').reset();
          setTimeout(()=>go('support'),450);
        }catch(err){
          notice('#ticketMsg',err.message||String(err));
        }
      };
    }
  }

  async function renderAssets(){
    const [assetRes,contractRes]=await Promise.all([
      supabase.from('assets').select('id,asset_number,serial_number,model_name,status,created_at').order('created_at',{ascending:false}),
      supabase.from('contracts').select('id,contract_number,status,start_date,end_date,created_at').order('created_at',{ascending:false})
    ]);
    if(assetRes.error) throw assetRes.error;
    if(contractRes.error) throw contractRes.error;

    const assetRows=(assetRes.data||[]).map(a=>
      '<tr><td><strong>'+esc(a.asset_number||'—')+'</strong></td><td>'+esc(a.model_name||'—')+'</td><td>'+esc(a.serial_number||'—')+'</td><td>'+esc(statusText(a.status))+'</td></tr>'
    );
    const contractRows=(contractRes.data||[]).map(c=>
      '<tr><td><strong>'+esc(c.contract_number||'—')+'</strong></td><td>'+esc(statusText(c.status))+'</td><td>'+esc(dateText(c.start_date))+'</td><td>'+esc(dateText(c.end_date))+'</td></tr>'
    );

    $('#home').innerHTML=
      pageIntro('契約・機器','登録されている契約と機器を確認できます。')+
      '<section class="card section"><h2>契約</h2>'+dataTable(['契約番号','状態','開始日','終了日'],contractRows)+'</section>'+
      '<section class="card section"><h2>機器</h2>'+dataTable(['機器番号','機種','シリアル','状態'],assetRows)+'</section>';
  }

  async function go(page){
    currentPage=page;
    setActiveNav();
    $('#home').innerHTML='<div class="card section"><p class="muted">読み込み中...</p></div>';
    try{
      if(page==='home') return await renderHome();
      if(page==='customers') return await renderCustomers();
      if(page==='quotes') return await renderQuotes();
      if(page==='orders') return await renderOrders();
      if(page==='support') return await renderSupport();
      if(page==='settings') return await renderSettings();
      if(page==='assets') return await renderAssets();
      return await renderHome();
    }catch(e){
      $('#home').innerHTML='<div class="notice error">読み込みに失敗しました: '+esc(e.message||String(e))+'</div>';
    }
  }

  async function prepareMfa(){
    show('mfaView');
    const f=await supabase.auth.mfa.listFactors();
    if(f.error) return notice('#mfaMsg',f.error.message);
    const verified=[...(f.data?.totp||[]),...(f.data?.phone||[])].find(x=>x.status==='verified');
    if(verified){
      $('#mfaEnrollBox').classList.add('hidden');
      const ch=await supabase.auth.mfa.challenge({factorId:verified.id});
      if(ch.error) return notice('#mfaMsg',ch.error.message);
      mfaState={factorId:verified.id,challengeId:ch.data.id};
    }
  }

  async function boot(){
    const {data:{session}}=await supabase.auth.getSession();
    if(!session){
      show('loginView');
      $('#logoutBtn').classList.add('hidden');
      $('#userBadge').classList.add('hidden');
      return;
    }

    $('#logoutBtn').classList.remove('hidden');
    $('#userBadge').textContent=session.user.email||'ログイン中';
    $('#userBadge').classList.remove('hidden');

    try{
      bootData=await rpc('current_app_bootstrap');
    }catch(e){
      const m=String(e.message||e);
      if(m.toLowerCase().includes('aal2')) return prepareMfa();
      show('loginView');
      notice('#loginMsg',m);
      return;
    }

    show('appView');
    $('#pageTitle').textContent=roleLabel(bootData.context?.role);
    $('#companyName').textContent=bootData.context?.company_name||'';
    integrations();
    renderNav();
    await go('home');
  }

  $('#loginForm').onsubmit=async e=>{
    e.preventDefault();
    $('#loginMsg').classList.add('hidden');
    const {error}=await supabase.auth.signInWithPassword({
      email:$('#email').value.trim(),
      password:$('#password').value
    });
    if(error) return notice('#loginMsg',error.message);
    $('#password').value='';
    await boot();
  };

  $('#enrollBtn').onclick=async()=>{
    const r=await supabase.auth.mfa.enroll({factorType:'totp',friendlyName:'QuoteFlow Cloud'});
    if(r.error) return notice('#mfaMsg',r.error.message);
    mfaState={factorId:r.data.id};
    $('#qr').src=r.data.totp.qr_code;
    $('#qrWrap').classList.remove('hidden');
    $('#secret').textContent='Secret: '+r.data.totp.secret;
  };

  $('#verifyBtn').onclick=async()=>{
    let {factorId,challengeId}=mfaState;
    if(!factorId) return notice('#mfaMsg','Authenticatorを登録してください。');
    if(!challengeId){
      const ch=await supabase.auth.mfa.challenge({factorId});
      if(ch.error) return notice('#mfaMsg',ch.error.message);
      challengeId=ch.data.id;
    }
    const v=await supabase.auth.mfa.verify({
      factorId,
      challengeId,
      code:$('#mfaCode').value.trim()
    });
    if(v.error) return notice('#mfaMsg',v.error.message);
    $('#mfaCode').value='';
    await boot();
  };

  $('#logoutBtn').onclick=async()=>{
    await supabase.auth.signOut();
    bootData=null;
    currentPage='home';
    await boot();
  };

  try{
    const h=await rpc('app_health');
    $('#dbBadge').textContent=h?.ok?'DB接続 OK':'DB応答あり';
    $('#dbBadge').className='pill good';
  }catch(e){
    $('#dbBadge').textContent='DB接続エラー';
    $('#dbBadge').className='pill bad';
  }

  await boot();
</script>
</body>
</html>
