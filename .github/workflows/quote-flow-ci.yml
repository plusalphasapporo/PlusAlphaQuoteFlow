name: QuoteFlow CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unified deal workflow schema, linking, loss and direct order tests
        run: node --test tests/deal-workflow-*.test.mjs

      - name: Registration and quote revision regression tests
        run: node --test tests/workspace-registration.test.mjs

      - name: Deployment base-path regression checks
        run: node --test tests/deployment-base-path.test.mjs

      - name: Validate production HTML
        run: node scripts/validate-static.mjs

      - name: Test support-ticket navigation and drafts
        run: node --test tests/support-ticket-tabs.test.mjs

      - name: Work report access regression tests
        run: node --test tests/work-report-access.test.mjs

      - name: Edge function preflight regression
        run: node --test tests/edge-functions.cors.test.mjs

      - name: Demo cleanup preview regression
        run: node --test tests/demo-cleanup-preview.test.mjs

      - name: Customer basics are immediately visible
        run: node --test tests/customer-summary-visibility.test.mjs

      - name: Chrome browser workflow checks
        run: node scripts/validate-browser.mjs

      - name: Build staging preview
        run: node scripts/build-staging-preview.mjs
