name: QuoteFlow CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate production HTML
        run: node scripts/validate-static.mjs
      - name: Validate UI redesign compatibility
        run: node scripts/test-ui-redesign.mjs
      - name: Install DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Test UI DOM integration
        run: node scripts/test-ui-redesign-dom.mjs
      - name: Test customer web publication boundary
        run: node scripts/test-web-publication-boundary.mjs
      - name: Test knowledge publication safety
        run: node scripts/test-knowledge-publication-safety.mjs
      - name: Test AI rate limit classification
        run: node scripts/test-ai-rate-limit.mjs
      - name: Test AI Web Guide mocked end-to-end
        run: node scripts/test-ai-web-guide.mjs
      - name: Test ticket workspace recovery
        run: node scripts/test-ticket-workspace.mjs
      - name: Test ticket customer panel and M365 shortcut
        run: node scripts/test-ticket-customer-panel.mjs
      - name: Test role-aware unified notifications
        run: node scripts/test-unified-notifications.mjs
      - name: Test CallConnect verified real-time and fallback
        run: node scripts/test-callconnect-realtime.mjs
      - name: Validate ticket numbering migrations
        run: node scripts/test-ticket-number-migration.mjs
