name: QuoteFlow CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate production HTML
        run: node scripts/validate-static.mjs

      - name: Test operations UI stylesheet
        run: node scripts/test-operations-ui.mjs

      - name: Test customer directory and profile
        run: node scripts/test-customer-ui.mjs

      - name: Test asset ledger
        run: node scripts/test-asset-ledger-ui.mjs

      - name: Test case management and support navigation
        run: node scripts/test-case-workflow-ui.mjs

      - name: Test internal handoff workflow
        run: node scripts/test-handoff-workflow-ui.mjs

      - name: Test support operations workspace
        run: node scripts/test-support-workspace-ui.mjs

      - name: Test ticket workspace recovery
        run: node scripts/test-ticket-workspace.mjs
      - name: Validate ticket numbering migrations
        run: node scripts/test-ticket-number-migration.mjs
      - name: Test CallConnect audit handling
        run: node scripts/test-callconnect-audit.mjs

      - name: Validate staging preview build and production blocking
        run: node scripts/test-preview-build.mjs
