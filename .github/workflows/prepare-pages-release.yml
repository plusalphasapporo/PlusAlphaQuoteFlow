name: Prepare reviewed GitHub Pages release
on:
  push:
    branches: [release/github-pages-20261015]
    paths: [.github/workflows/prepare-pages-release.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'plusalphasapporo/PlusAlphaQuoteFlow' && github.ref == 'refs/heads/release/github-pages-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce path failures before changing application files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/deployment-base-path.test.mjs')
          s = p.read_text()
          old = "assert.ok(refs.length >= 7, 'all logo, stylesheet, manifest and runtime references must be checked');"
          new = "assert.ok(refs.length >= 6, 'all logo, manifest and runtime references must be checked');"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          if node --test tests/deployment-base-path.test.mjs > path-regression-before.log 2>&1; then
            cat path-regression-before.log
            echo 'Expected the confirmed pre-fix path regression to fail.'
            exit 1
          fi
          cat path-regression-before.log
          grep -q 'asset escapes deployment directory' path-regression-before.log
          grep -q '# fail 5' path-regression-before.log
      - name: Apply only reviewed deployment-path corrections
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','hash-object','index.html'], text=True).strip() == '132ce55ed44076e62c58a21c7c6db55ce83b14c7'
          p = Path('index.html')
          s = p.read_text()
          changes = [
              ('"/assets/quoteflow-mark.png"', '"./assets/quoteflow-mark.png"', 3),
              ('"/manifest.webmanifest"', '"./manifest.webmanifest"', 1),
              ("register('/sw.js')", "register('./sw.js')", 1),
              ('"/assets/support-ticket-tabs.js"', '"./assets/support-ticket-tabs.js"', 1),
              ('"/assets/notification-center.js"', '"./assets/notification-center.js"', 1)
          ]
          for old, new, count in changes:
              assert s.count(old) == count, (old, s.count(old))
              s = s.replace(old, new)
          p.write_text(s)
          p = Path('manifest.webmanifest')
          m = json.loads(p.read_text())
          for key in ['id', 'start_url', 'scope']:
              assert m[key] == '/'
              m[key] = './'
          for icon in m['icons']:
              assert icon['src'] == '/assets/quoteflow-mark.png'
              icon['src'] = './assets/quoteflow-mark.png'
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n')
          p = Path('sw.js')
          s = p.read_text()
          changes = [
              ("self.addEventListener('install'", "const appUrl=new URL('./',self.location.href);\nself.addEventListener('install'"),
              ("icon:'/assets/quoteflow-mark.png'", "icon:new URL('assets/quoteflow-mark.png',appUrl).href"),
              ("badge:'/assets/quoteflow-mark.png'", "badge:new URL('assets/quoteflow-mark.png',appUrl).href"),
              ("data:{url:'/'}", "data:{url:appUrl.href}"),
              ("if(new URL(client.url).origin===self.location.origin){", "const clientUrl=new URL(client.url);\n      if(clientUrl.origin===appUrl.origin && clientUrl.pathname.startsWith(appUrl.pathname)){"),
              ("self.clients.openWindow('/')", "self.clients.openWindow(appUrl.href)")
          ]
          for old, new in changes:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          p = Path('scripts/validate-static.mjs')
          s = p.read_text()
          old = r'src="\/assets\/quoteflow-mark\.png"'
          new = r'src="\.\/assets\/quoteflow-mark\.png"'
          assert s.count(old) == 1
          s = s.replace(old, new)
          for path in ['assets/quoteflow-mark.png', 'assets/notification-center.js', 'assets/support-ticket-tabs.js', 'manifest.webmanifest', 'sw.js']:
              s = s.replace('"/' + path + '"', '"./' + path + '"').replace("'/" + path + "'", "'./" + path + "'")
          p.write_text(s)
          PY
      - name: Verify all tests and build before saving correction
        run: |
          node --test tests/*.test.mjs
          node scripts/validate-static.mjs
          node scripts/validate-browser.mjs
          node scripts/build-staging-preview.mjs
          git diff --check
      - name: Save only the verified changes to the isolated release branch
        run: |
          git add index.html manifest.webmanifest sw.js scripts/validate-static.mjs tests/deployment-base-path.test.mjs
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: make browser assets and notifications work under GitHub Pages subpath'
          git push origin HEAD:refs/heads/release/github-pages-20261015
